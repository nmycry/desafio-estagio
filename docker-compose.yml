services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-citizens}
      DB_TEST_NAME: ${DB_TEST_NAME:-citizens_test}
      DB_USER: ${DB_USER:-citizens}
      DB_PASSWORD: ${DB_PASSWORD:-citizens}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-citizens}
      MYSQL_USER: ${DB_USER:-citizens}
      MYSQL_PASSWORD: ${DB_PASSWORD:-citizens}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
